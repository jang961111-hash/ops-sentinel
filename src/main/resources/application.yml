server:
  port: 8080

spring:
  application:
    name: ops-sentinel

  datasource:
    # LOCK_TIMEOUT: IncidentDetectionService의 Resource 비관적 락(SELECT FOR UPDATE) 대기시간.
    # H2 기본값(1000ms)은 다수 스레드가 동시에 같은 리소스로 몰리면 짧아 재시도가 잦아지므로 여유를 둔다.
    url: jdbc:h2:mem:opssentinel;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # US-006(AOP 감사로그) 도입 이후 필요해진 설정: IncidentActionService.decideAndRecord는
      # Resource 비관적 락을 쥔 트랜잭션(TransactionTemplate) 안에서 호출되는데, 그 메서드에
      # 붙은 @Auditable이 AuditLogRecorder.recordSuccess(REQUIRES_NEW)를 호출하면 Spring이
      # 바깥 트랜잭션의 커넥션은 그대로 쥔 채로 감사로그 저장용 커넥션을 하나 더 풀에서
      # 빌려간다. 기본 풀 크기(10)로는 동시요청 10건 테스트에서 "바깥 트랜잭션 대기 커넥션 +
      # 락 보유 스레드의 REQUIRES_NEW 커넥션"이 겹쳐 풀이 고갈되고 락 대기가 타임아웃되는
      # 현상이 실측됐다(IncidentDetectionConcurrencyTest). 여유를 두어 30으로 늘린다.
      maximum-pool-size: 30

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 기본값(never)은 /actuator/health/{component} 하위 경로(예: incidentEngine)의
      # 상세정보를 숨겨 US-010 커스텀 인디케이터가 UP/DOWN 외 상세를 보여주지 못한다.
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
