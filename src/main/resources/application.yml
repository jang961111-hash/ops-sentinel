server:
  port: 8080

spring:
  application:
    name: ops-sentinel

  datasource:
    # LOCK_TIMEOUT: IncidentDetectionService의 Resource 비관적 락(SELECT FOR UPDATE) 대기시간.
    # H2 기본값(1000ms)은 다수 스레드가 동시에 같은 리소스로 몰리면 짧아 재시도가 잦아지므로 여유를 둔다.
    url: jdbc:h2:mem:opssentinel;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # HikariCP 기본값(10)으로 되돌렸다(2026-09, fix/lock-scope-and-audit).
      # 이력: US-006 이후 10 -> 30, 2026-08-09 40건 동시요청 대응으로 30 -> 60까지 늘렸었다.
      # 그러나 2026-09 재측정에서 증설은 문턱만 옮길 뿐이었다(풀 60에서도 150건이면 409 91~93건,
      # 감사 38~39%). 원인은 풀 크기가 아니라 ① OSIV가 요청마다 커넥션을 응답 끝까지 쥔 것,
      # ② 락을 쥔 트랜잭션 안의 감사(REQUIRES_NEW)가 커넥션을 하나 더 요구한 것,
      # ③ 락 안의 OpenAI 호출이었다. 셋을 구조로 없앤 뒤 풀 10에서 같은 리소스 동시 150건도
      # 201 450/450, 감사 450/450이었다(측정: 레포 밖 lock_experiment.py, 3라운드).
      maximum-pool-size: 10

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # OSIV(open-in-view)를 끈다. 켜 두면 요청 스레드가 처음 쿼리한 커넥션을 응답이 끝날 때까지
    # 쥐고 있어(Spring의 DELAYED_ACQUISITION_AND_HOLD), 락 대기 요청 N건이 풀 N개를 그대로 점유한다.
    # 또 H2 락 타임아웃으로 그 커넥션이 폐기되면 같은 요청의 재시도·감사로그가 모두 닫힌 커넥션을
    # 다시 써서 "JDBC begin transaction failed: Connection is closed"로 실패했다(2026-09 재측정:
    # 409 요청마다 재시도 3회·감사 2건 전부 실패 → FAIL 감사 0건). 컨트롤러는 fetch join으로
    # 필요한 연관을 미리 읽으므로 뷰 단계 지연 로딩이 필요 없다.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 기본값(never)은 /actuator/health/{component} 하위 경로(예: incidentEngine)의
      # 상세정보를 숨겨 US-010 커스텀 인디케이터가 UP/DOWN 외 상세를 보여주지 못한다.
      show-details: always

# springdoc.swagger-ui.path는 일부러 설정하지 않는다 — springdoc 기본값이 이미
# `/swagger-ui/index.html`을 직접 서빙하는데, 이 경로를 커스텀 path로 다시 지정하면
# `/swagger-ui/index.html` -> `/swagger-ui/swagger-ui/index.html`로 이중 리다이렉트되는
# 버그가 있었다(US-012 self-QA에서 발견). PRD 8장이 요구하는 URL을 리다이렉트 없이
# 그대로 노출하려면 이 설정을 두지 않는 게 맞다.

# US-013: Incident 판단근거 자연어 요약(aiSummary) 생성용 OpenAI 연동 설정.
# api-key가 비어있으면 AiSummaryService가 네트워크 호출을 시도하지 않고 즉시 폴백 문장을
# 쓴다 — 연동 자체가 optional이라 이 프로퍼티가 없어도 앱은 정상 동작한다. timeout-ms는
# Spring Boot 환경변수 완화 바인딩(relaxed binding) 규칙에 따라 OPENAI_TIMEOUT_MS
# 환경변수로도 재정의할 수 있다(예: 타임아웃 동작 검증 시 일시적으로 짧게 설정).
# base-url은 Chat Completions 경로(/chat/completions) 앞부분이다. 기본값은 실제 OpenAI이고,
# 테스트(로컬 가짜 서버로 지연 주입)·프록시·호환 공급자용으로 OPENAI_BASE_URL로 바꿀 수 있다.
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: gpt-4o-mini
  timeout-ms: 3000

# US-014: 관리자 전용 엔드포인트(GET /api/audit-logs, PATCH /api/incidents/{id}/resolve) 보호용
# JWT 최소 구현 설정. secret이 비어있으면 JwtTokenProvider가 기동 시 랜덤 키를 생성해서라도
# 동작은 하게 만든다(단, 재기동 시 이전에 발급한 토큰은 전부 무효화된다 — 데모 용도라 허용).
# admin.password 기본값(admin1234)은 데모/로컬 테스트 전용이며, 운영 환경에서는 반드시
# ADMIN_PASSWORD 환경변수로 재정의해야 한다.
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

admin:
  password: ${ADMIN_PASSWORD:admin1234}
